<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facility Dashboard — Lifeguard</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <img class="logo-circle" src="/logo.png" alt="Martinsburg-Berkeley County Parks and Recreation logo" />
      <div>
        <p class="title">Facility dashboard</p>
        <p class="subtitle" id="today"></p>
      </div>
    </div>
    <span class="status-dot" id="status"><span class="dot"></span><span id="status-text">connecting</span></span>
  </div>

  <div class="notice hidden" id="notice">
    <div class="label">Notice for today</div>
    <p class="notice-text"></p>
  </div>

  <div class="receiver-grid">
    <div>
      <p class="section-label">Now playing</p>
      <div class="now-playing-box">
        <p class="name" id="now-playing">Nothing playing</p>
        <p class="meta" id="now-zone">-</p>
      </div>

      <div class="slider-row">
        <div class="row-top"><label>Music volume</label><span class="value" id="music-vol-val">70</span></div>
        <input type="range" id="music-vol" min="0" max="100" value="70" />
      </div>
      <div class="slider-row" style="margin-bottom:1.5rem;">
        <div class="row-top"><label>Mic volume</label><span class="value" id="mic-vol-val">70</span></div>
        <input type="range" id="mic-vol" min="0" max="100" value="70" />
      </div>

      <div class="action-grid" style="grid-template-columns:1fr 1fr;">
        <button class="action-btn" id="mic-btn">Announce</button>
        <button class="action-btn" id="music-btn">Music</button>
      </div>
    </div>

    <div>
      <p class="section-label">Task lists</p>
      <div class="task-grid" id="task-grid" data-include-reports="true" style="grid-template-columns:1fr;"></div>
    </div>
  </div>
</div>

<script src="/shared.js"></script>
<script>
document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

function setStatus(online) {
  const el = document.getElementById('status');
  const text = document.getElementById('status-text');
  el.classList.toggle('online', online);
  text.textContent = online ? 'connected' : 'reconnecting';
}

async function refreshTasks() {
  const grid = document.getElementById('task-grid');
  const res = await apiFetch('/api/tasks');
  renderTaskGrid(grid, await res.json(), { includeReports: true });
}

function handleReceiverMessage(e) {
  if (typeof e.data !== 'string') return; // ignore audio clips relayed elsewhere
  const msg = JSON.parse(e.data);
  if (msg.type === 'nowPlaying') {
    document.getElementById('now-playing').textContent = `${msg.playlist} — ${msg.track}`;
    document.getElementById('now-zone').textContent = `Zone: ${msg.zone}`;
  } else if (msg.type === 'stopped') {
    document.getElementById('now-playing').textContent = 'Nothing playing';
    document.getElementById('now-zone').textContent = '-';
  }
}

ensureAccessCode().then(async (code) => {
  connectWS('guard', () => setStatus(true), handleReceiverMessage).addEventListener('close', () => setStatus(false));
  wirePushToTalk(document.getElementById('mic-btn'), 'both');
  document.getElementById('music-btn').addEventListener('click', openMusicPopup);

  document.getElementById('music-vol').addEventListener('input', (e) => {
    document.getElementById('music-vol-val').textContent = e.target.value;
    sendControlMessage({ type: 'setVolume', target: 'music', value: e.target.value / 100 });
  });
  document.getElementById('mic-vol').addEventListener('input', (e) => {
    document.getElementById('mic-vol-val').textContent = e.target.value;
    sendControlMessage({ type: 'setVolume', target: 'mic', value: e.target.value / 100 });
  });

  await loadNotice(document.getElementById('notice'));
  refreshTasks();
  setInterval(refreshTasks, 60000);
  setInterval(() => loadNotice(document.getElementById('notice')), 30000);
});
</script>
</body>
</html>
