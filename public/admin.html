<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facility Dashboard — Admin</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <img class="logo-circle" src="/logo.png" alt="Martinsburg-Berkeley County Parks and Recreation logo" />
      <div>
        <p class="title">Facility dashboard</p>
        <p class="subtitle" id="today"></p>
      </div>
    </div>
    <span class="status-dot" id="status"><span class="dot"></span><span id="status-text">connecting</span></span>
  </div>

  <div class="notice hidden" id="notice">
    <div class="label">Notice for today</div>
    <p class="notice-text"></p>
  </div>
  <button id="edit-notice" style="margin-bottom:1.25rem; font-size:12px;">Edit notice</button>

  <p class="section-label">Mic zone</p>
  <div class="zone-grid" id="mic-zone" style="margin-bottom:1.25rem;">
    <button data-zone="pool">Pool</button>
    <button data-zone="poolhouse">Pool house</button>
    <button data-zone="both">Both</button>
  </div>

  <div class="slider-row">
    <div class="row-top"><label>Mic volume</label><span class="value" id="mic-vol-val">70</span></div>
    <input type="range" id="mic-vol" min="0" max="100" value="70" />
  </div>
  <div class="slider-row" style="margin-bottom:1.5rem;">
    <div class="row-top"><label>Amplify mic</label><span class="value" id="mic-amp-val">20</span></div>
    <input type="range" id="mic-amp" min="0" max="100" value="20" />
  </div>

  <div class="slider-row">
    <div class="row-top"><label>Pool channel volume</label><span class="value" id="pool-chan-val">100</span></div>
    <input type="range" id="pool-chan" min="0" max="100" value="100" />
  </div>
  <div class="slider-row" style="margin-bottom:1.5rem;">
    <div class="row-top"><label>Pool house channel volume</label><span class="value" id="poolhouse-chan-val">100</span></div>
    <input type="range" id="poolhouse-chan" min="0" max="100" value="100" />
  </div>

  <div class="action-grid">
    <button class="action-btn" id="mic-btn">Push to talk</button>
    <button class="action-btn" id="music-btn">Music</button>
  </div>

  <p class="section-label">Task lists</p>
  <div class="task-grid" id="task-grid" data-include-reports="true"></div>
</div>

<script src="/shared.js"></script>
<script>
document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

function setStatus(online) {
  const el = document.getElementById('status');
  const text = document.getElementById('status-text');
  el.classList.toggle('online', online);
  text.textContent = online ? 'connected' : 'reconnecting';
}

async function refreshTasks() {
  const grid = document.getElementById('task-grid');
  const res = await apiFetch('/api/tasks');
  renderTaskGrid(grid, await res.json(), { includeReports: true, showHistory: true });
}

async function refreshNotice() {
  await loadNotice(document.getElementById('notice'));
}

ensureAccessCode().then(async (code) => {
  connectWS('admin', () => setStatus(true)).addEventListener('close', () => setStatus(false));

  let micZone = 'both';
  const zoneWrap = document.getElementById('mic-zone');
  [...zoneWrap.children].forEach((b) => {
    if (b.dataset.zone === 'both') b.classList.add('selected');
    b.addEventListener('click', () => {
      micZone = b.dataset.zone;
      [...zoneWrap.children].forEach((c) => c.classList.remove('selected'));
      b.classList.add('selected');
    });
  });
  wirePushToTalk(document.getElementById('mic-btn'), () => micZone);

  document.getElementById('music-btn').addEventListener('click', openMusicPopup);

  document.getElementById('mic-vol').addEventListener('input', (e) => {
    document.getElementById('mic-vol-val').textContent = e.target.value;
    sendControlMessage({ type: 'setVolume', target: 'mic', value: e.target.value / 100 });
  });
  document.getElementById('mic-amp').addEventListener('input', (e) => {
    document.getElementById('mic-amp-val').textContent = e.target.value;
    sendControlMessage({ type: 'setVolume', target: 'micAmp', value: e.target.value / 100 });
  });
  document.getElementById('pool-chan').addEventListener('input', (e) => {
    document.getElementById('pool-chan-val').textContent = e.target.value;
    sendControlMessage({ type: 'setVolume', target: 'poolChannel', value: e.target.value / 100 });
  });
  document.getElementById('poolhouse-chan').addEventListener('input', (e) => {
    document.getElementById('poolhouse-chan-val').textContent = e.target.value;
    sendControlMessage({ type: 'setVolume', target: 'poolhouseChannel', value: e.target.value / 100 });
  });
  document.getElementById('edit-notice').addEventListener('click', async () => {
    const text = prompt('Notice text for today:');
    if (text === null) return;
    await apiFetch('/api/notices', { method: 'POST', body: JSON.stringify({ text }) });
    refreshNotice();
  });
  refreshTasks();
  refreshNotice();
  setInterval(refreshTasks, 60000);
});
</script>
</body>
</html>
